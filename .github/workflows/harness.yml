name: Check Claude Code harness

on:
  pull_request:
    paths:
      - "ttstack/**"
      - "harness/**"
      - "scripts/**"
      - "LICENSE"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/harness.yml"
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check generated ttstack harness tree
        run: node scripts/generate-ttstack-harness-trees.mjs --check
